<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
  <title id="title">Independent support for broad morphology classes</title>
  <desc id="desc">Elongated one-dimensional morphology has 214 rows and 42 molecular identities; spherical particulate has 52 rows and 20 molecular identities; vesicular has 42 rows and 10 molecular identities; crystalline has 34 rows but only 1 molecular identity.</desc>
  <rect width="960" height="530" fill="white"/>
  <style>
    .title{font:700 26px Arial,sans-serif;fill:#111827}.sub{font:16px Arial,sans-serif;fill:#4b5563}
    .h{font:700 17px Arial,sans-serif;fill:#111827}.lab{font:17px Arial,sans-serif;fill:#111827}.n{font:700 18px Arial,sans-serif;fill:#111827}
    .rows{fill:#93c5fd}.mols{fill:#1d4ed8}.warn{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5}.grid{stroke:#e5e7eb;stroke-width:1}
  </style>
  <text x="40" y="48" class="title">Condition rows vs independent molecular support</text>
  <text x="40" y="78" class="sub">Why morphology row count can overstate the amount of transferable chemical evidence</text>
  <text x="310" y="120" class="h">Condition rows</text><text x="655" y="120" class="h">Unique molecular identities</text>
  <line x1="300" y1="140" x2="300" y2="430" stroke="#9ca3af"/><line x1="645" y1="140" x2="645" y2="430" stroke="#9ca3af"/>
  <text x="40" y="180" class="lab">Elongated / 1D</text><rect x="300" y="155" width="300" height="34" rx="5" class="rows"/><text x="610" y="179" class="n">214</text><rect x="645" y="155" width="252" height="34" rx="5" class="mols"/><text x="907" y="179" class="n">42</text>
  <text x="40" y="245" class="lab">Spherical / particulate</text><rect x="300" y="220" width="72.9" height="34" rx="5" class="rows"/><text x="383" y="244" class="n">52</text><rect x="645" y="220" width="120" height="34" rx="5" class="mols"/><text x="775" y="244" class="n">20</text>
  <text x="40" y="310" class="lab">Vesicular</text><rect x="300" y="285" width="58.9" height="34" rx="5" class="rows"/><text x="369" y="309" class="n">42</text><rect x="645" y="285" width="60" height="34" rx="5" class="mols"/><text x="715" y="309" class="n">10</text>
  <rect x="25" y="340" width="910" height="78" rx="8" class="warn"/>
  <text x="40" y="382" class="lab">Crystalline</text><rect x="300" y="357" width="47.7" height="34" rx="5" class="rows"/><text x="358" y="381" class="n">34</text><rect x="645" y="357" width="6" height="34" rx="3" class="mols"/><text x="663" y="381" class="n">1</text>
  <text x="40" y="472" class="sub">Crystalline morphology was retained descriptively but excluded from transferable ML: 34 rows came from one molecule and one publication.</text>
</svg>
