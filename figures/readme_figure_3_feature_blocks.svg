<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Feature-block permutation importance</title>
  <desc id="desc">Solvent identity and composition has the largest positive change in PR-AUC when permuted, approximately 0.300. Non-solvent conditions are approximately 0.008, sequence physicochemistry approximately minus 0.014 and molecular modifications approximately minus 0.039.</desc>
  <rect width="960" height="500" fill="white"/>
  <style>
    .title{font:700 26px Arial,sans-serif;fill:#111827}.sub{font:16px Arial,sans-serif;fill:#4b5563}
    .label{font:17px Arial,sans-serif;fill:#111827}.axis{font:14px Arial,sans-serif;fill:#6b7280}
    .value{font:700 16px Arial,sans-serif;fill:#111827}.pos{fill:#2563eb}.neg{fill:#9ca3af}.grid{stroke:#e5e7eb;stroke-width:1}
  </style>
  <text x="40" y="48" class="title">Feature-block permutation importance</text>
  <text x="40" y="78" class="sub">Decrease in holdout PR-AUC after jointly permuting each information block</text>
  <line x1="390" y1="120" x2="390" y2="390" stroke="#111827" stroke-width="1.5"/>
  <line x1="310" y1="120" x2="310" y2="390" class="grid"/><line x1="550" y1="120" x2="550" y2="390" class="grid"/><line x1="710" y1="120" x2="710" y2="390" class="grid"/><line x1="870" y1="120" x2="870" y2="390" class="grid"/>
  <text x="310" y="420" class="axis" text-anchor="middle">−0.05</text><text x="390" y="420" class="axis" text-anchor="middle">0</text>
  <text x="550" y="420" class="axis" text-anchor="middle">0.10</text><text x="710" y="420" class="axis" text-anchor="middle">0.20</text><text x="870" y="420" class="axis" text-anchor="middle">0.30</text>
  <text x="40" y="160" class="label">Solvent identity / composition</text><rect x="390" y="137" width="479.8" height="34" rx="5" class="pos"/><text x="878" y="160" class="value">0.300</text>
  <text x="40" y="225" class="label">Non-solvent conditions</text><rect x="390" y="202" width="13.0" height="34" rx="5" class="pos"/><text x="414" y="225" class="value">0.008</text>
  <text x="40" y="290" class="label">Sequence physicochemistry</text><rect x="367.9" y="267" width="22.1" height="34" rx="5" class="neg"/><text x="354" y="290" class="value" text-anchor="end">−0.014</text>
  <text x="40" y="355" class="label">Molecular modifications</text><rect x="327.6" y="332" width="62.4" height="34" rx="5" class="neg"/><text x="316" y="355" class="value" text-anchor="end">−0.039</text>
  <text x="40" y="466" class="sub">Interpretation: solvent/environment is dominant, but fully aqueous ablations show that other conditions still carry signal.</text>
</svg>
